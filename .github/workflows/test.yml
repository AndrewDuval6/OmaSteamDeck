name: Build 1 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  startup-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/startup-qa" --no-audit --no-fund --save-exact playwright@1.63.0
          "$RUNNER_TEMP/startup-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify real WebGL startup and failure recovery
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/startup-qa/node_modules/playwright/index.mjs" node tools/check_startup.mjs
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libsdl2-2.0-0
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/smoke_input.py
      - run: python -m compileall -q omasteamdeck tools
      - run: bash -n run.sh && ./run.sh --help
      - name: Verify installed package outside the checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps --target "$RUNNER_TEMP/osd-package" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/osd-package" python -m omasteamdeck.app --help
          PYTHONPATH="$RUNNER_TEMP/osd-package" python "$GITHUB_WORKSPACE/tools/smoke_package.py" "$RUNNER_TEMP/osd-package"
