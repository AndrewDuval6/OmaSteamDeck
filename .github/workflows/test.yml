name: Build 1 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libsdl2-2.0-0
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m compileall -q omasteamdeck tools
