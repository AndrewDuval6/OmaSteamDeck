[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omasteamdeck"
version = "0.2.0"
description = "A native, controller-first handheld launcher"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.scripts]
omasteamdeck = "omasteamdeck.app:main"

[tool.setuptools.packages.find]
include = ["omasteamdeck*"]

[tool.setuptools.package-data]
omasteamdeck = ["assets/*.png", "assets/*.svg", "assets/startup/*.html", "assets/startup/*.css", "assets/startup/*.js", "assets/startup/vendor/*.js", "assets/startup/vendor/*.txt"]
